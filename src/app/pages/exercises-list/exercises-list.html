<section class="space-y-4">
  <h1 class="text-2xl font-bold text-primary-dark">Exercices de code</h1>
  <p>Complète la fonction, lance les tests, valide tous les cas.</p>

  @if (exercises(); as list) {
    <ul class="grid gap-3 sm:grid-cols-2">
      @for (e of list; track e.id) {
        <li>
          <a [routerLink]="['/exercises', e.id]" class="flex h-full flex-col gap-1 border-2 bg-white p-4 hover:bg-purple-50"
            [class]="progress.solvedExercises().includes(e.id) ? 'border-brand-green' : 'border-gray-200'">
            <span class="flex items-center justify-between">
              <span class="font-semibold">{{ e.title }}</span>
              @if (progress.solvedExercises().includes(e.id)) {
                <span aria-label="Résolu">✅</span>
              }
            </span>
            <span class="text-sm text-gray-600">{{ e.topic }} · {{ label(e.difficulty) }}</span>
          </a>
        </li>
      }
    </ul>
  } @else {
    <p>Chargement…</p>
  }
</section>
